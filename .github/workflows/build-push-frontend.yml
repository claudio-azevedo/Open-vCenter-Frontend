name: Build and push frontend image

on:
  push:
    # `demo` builds the standalone demo image (OVC_DEMO_MODE baked in) as :demo
    branches: [main, demo]
    tags:
      - "*.*.*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ovc-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          DEMO=false
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${{ env.IMAGE }}:${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "demo" ]; then
            DEMO=true
            TAGS="${{ env.IMAGE }}:demo
          ${{ env.IMAGE }}:demo-${{ github.sha }}"
          else
            TAGS="${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "demo=$DEMO"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # the :demo image starts in demo mode with no env at all
          build-args: |
            OVC_DEMO_MODE=${{ steps.tags.outputs.demo == 'true' && 'true' || '' }}

  # Demo branch only: deploy the demo as a Cloudflare Worker (served at the
  # custom domain set in vite.config.ts -> nitro.cloudflare.wrangler).
  # Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template,
  # scoped to the openvcenter.com zone) and CLOUDFLARE_ACCOUNT_ID.
  deploy-demo-worker:
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Worker
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_module

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c .output/server/wrangler.json
